apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab
spec:
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: web
---
apiVersion: v1
kind: Service
metadata:
  name: web-headless
  namespace: lab
spec:
  clusterIP: None
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: web
