# manifests/api.yaml (Deployment + Service)
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: lab }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: api } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: traefik/whoami:1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
          args: ["--port=8080", "--name=api"]
          ports: [{ containerPort: 8080, name: http }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { cpu: 50m, memory: 32Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: lab }
spec:
  selector: { app: api }
  ports: [{ name: http, port: 80, targetPort: http }]
