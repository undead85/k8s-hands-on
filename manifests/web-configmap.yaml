apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: lab
data:
  mode: "production-change"

  default.conf: |
    server {
        listen 8080;
        server_name localhost;
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }
        location /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'OK';
        }
        location /readiness {
            access_log off;
            add_header Content-Type text/plain;
            if (-f /tmp/romper_readiness) { return 503; }
            return 200 'OK';
        }
        location /liveness {
            access_log off;
            add_header Content-Type text/plain;
            if (-f /tmp/romper_liveness) { return 503; }
            return 200 'OK';
        }
    }
